name: Hent kurser

on:
  schedule:
    - cron: "45 16 * * 1-5"   # børsdager 17:45 (vinter) / 18:45 (sommer) norsk tid
    - cron: "0 8 * * 6"       # lørdag morgen: utbytte
  workflow_dispatch:
    inputs:
      mode:
        description: "prices-daily | prices-full | dividends | all"
        default: "all"
  push:
    branches: [main]
    paths: [".github/workflows/**", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Velg modus
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          case "$EVENT" in
            workflow_dispatch) m="$INPUT_MODE" ;;
            push) m="all" ;;
            *) case "$(date -u +%u)" in 6) m="dividends" ;; 5) m="prices-full" ;; *) m="prices-daily" ;; esac ;;
          esac
          case "$m" in prices-daily|prices-full|dividends|all) ;; *) echo "Ugyldig modus"; exit 1 ;; esac
          echo "mode=$m" >> "$GITHUB_OUTPUT"

      - name: Hent data
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
        run: python3 scripts/fetch.py "${{ steps.mode.outputs.mode }}"

      - name: Lagre endringer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Ingen endringer"; exit 0; fi
          git commit -m "Data $(date -u +%F) (${{ steps.mode.outputs.mode }})"
          git pull --rebase
          git push
